name: Generate Daily Research Note

on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests paramiko nbformat

      - name: Debug repos
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python scripts/debug_repos.py

      - name: Generate daily research note
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_USERNAME: Akashkharita
          CASCADIA_HOST: cascadia.ess.washington.edu
          CASCADIA_USER: ak287
          CASCADIA_SSH_KEY: ${{ secrets.CASCADIA_SSH_KEY }}
        run: python scripts/generate_note.py

      - name: Commit and push note
        run: |
          git config user.name "research-notes bot"
          git config user.email "actions@github.com"
          git add notes/
          git diff --staged --quiet || git commit -m "📝 Daily note $(date -u +%Y-%m-%d)"
          git push
